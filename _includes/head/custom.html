<!-- Swiss design: Archivo + IBM Plex Mono, 12-col grid, paper ground, red/blue accents -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* --- Tokens --- */
:root {
  --sw-ink:   #111111;
  --sw-paper: #F3F1EA;
  --sw-red:   #FC3D21;
  --sw-blue:  #0B3D91;
  --sw-body:  #333333;
  --sw-mute:  #555555;
  --sw-hair:  #CFCCC2;
  --sw-mono:  'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}

/* --- Base --- */
html, body {
  background: var(--sw-paper) !important;
  color: var(--sw-ink);
  padding: 0 !important;
  margin: 0;
}
body {
  font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--sw-red); color: #ffffff; }
*:focus:not(:focus-visible) { outline: 0; }
*:focus-visible { outline: 2px solid var(--sw-red); outline-offset: 2px; }

/* --- Hide Jekyll chrome --- */
.masthead, .page__footer, .sidebar { display: none !important; }
#main, .page, .page__inner-wrap, .page__content {
  float: none !important; width: 100% !important;
  max-width: none !important;
  padding: 0 !important; margin: 0 !important;
  background: transparent !important;
}

/* --- Reset theme element styles inside the page (specificity 0,1,0) --- */
.sw :where(h1, h2, h3, p, ul, ol, li, figure, figcaption, dl, dt, dd) {
  margin: 0; padding: 0;
  font-family: inherit; font-style: normal; color: inherit;
}
.sw :where(ul, ol) { list-style: none; }
.sw :where(img) { display: block; max-width: 100%; border-radius: 0; margin: 0; box-shadow: none; }

/* --- Page wrapper --- */
.sw {
  box-sizing: border-box;
  max-width: 1280px; margin: 0 auto;
  padding: 0 20px;
  font-size: 16px; line-height: 1.5;
  color: var(--sw-ink);
}
.sw *, .sw *::before, .sw *::after { box-sizing: border-box; }
@media (min-width: 900px) { .sw { padding: 0 48px; } }

.sw a { color: var(--sw-ink); text-decoration: none; transition: color 0.15s, background 0.15s; }
.sw a:hover { color: var(--sw-red); text-decoration: none; }
.sw-u  { border-bottom: 2px solid var(--sw-ink); }
.sw-u1 { border-bottom: 1px solid var(--sw-ink); }

/* --- 12-column grid (stacks below 900px) --- */
.sw-grid { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 20px; }
@media (min-width: 900px) {
  .sw-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 0; }
}

.sw-label {
  font-family: var(--sw-mono);
  font-size: 11px; font-weight: 600; line-height: 1.6;
  text-transform: uppercase; letter-spacing: 0.12em;
}
.sw-red  { color: var(--sw-red); }
.sw-mute { color: var(--sw-mute); }

/* --- Top strip --- */
.sw-strip {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  margin: 0 -20px; padding: 10px 20px;
  background: var(--sw-ink); color: var(--sw-paper);
  font-family: var(--sw-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
}
.sw-strip-id { display: flex; align-items: center; gap: 10px; }
.sw-sq { display: inline-block; width: 8px; height: 8px; background: var(--sw-red); }
.sw-strip-meta { display: none; }
@media (min-width: 900px) {
  .sw-strip { margin: 0 -48px; padding: 10px 48px; }
  .sw-strip-meta { display: inline; }
}

/* --- Masthead --- */
.sw-mast {
  align-items: end; row-gap: 8px;
  padding: 28px 0 18px;
  border-bottom: 4px solid var(--sw-ink);
}
.sw-mast-name { font-size: 30px; font-weight: 900; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.sw-mast-role {
  font-family: var(--sw-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.1em; line-height: 1.5; color: var(--sw-body);
}
.sw-nav {
  display: flex; flex-wrap: wrap; gap: 0 18px;
  font-family: var(--sw-mono); font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
}
.sw-nav a { padding: 12px 0; }
.sw .sw-nav a.is-active { color: var(--sw-red); }
@media (min-width: 900px) {
  .sw-mast-name { grid-column: 1 / span 3; }
  .sw-mast-role { grid-column: 4 / span 3; }
  .sw-nav { grid-column: 7 / span 6; justify-content: flex-end; gap: 0 24px; }
}

/* Colour bar under the masthead */
.sw-bar { display: grid; grid-template-columns: 3fr 2fr 1fr 6fr; height: 10px; margin-top: 4px; }
.sw-bar > :nth-child(1) { background: var(--sw-red); }
.sw-bar > :nth-child(2) { background: var(--sw-blue); }
.sw-bar > :nth-child(3) { background: var(--sw-ink); }

/* --- Numbered sections (home) --- */
.sw-sec { padding: 40px 0 48px; border-bottom: 1px solid var(--sw-ink); }
.sw-sec--end { border-bottom-width: 4px; }
@media (min-width: 900px) {
  .sw-sec { padding: 48px 0 56px; }
  .sw-sec-label { grid-column: 1 / span 2; }
  .sw-sec-main  { grid-column: 3 / span 10; }
}

/* Hero */
.sw .sw-hero { padding: 48px 0 56px; }
.sw-hero h1 {
  font-size: clamp(44px, 7vw, 84px); font-weight: 800;
  line-height: 0.98; letter-spacing: -0.035em;
}
.sw-hero-lede { font-size: 20px; line-height: 1.4; }
@media (min-width: 900px) {
  .sw .sw-hero { padding: 56px 0 64px; }
  .sw-hero h1 { grid-column: 3 / span 10; }
  .sw-hero-lede { grid-column: 3 / span 6; margin-top: 36px; }
}

/* About */
.sw-portrait { width: 100%; max-width: 320px; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--sw-ink); }
.sw-portrait-cap { margin-top: 12px; font-family: var(--sw-mono); font-size: 11px; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sw-mute); }
.sw-bio { display: flex; flex-direction: column; gap: 24px; font-size: 18px; line-height: 1.5; }
.sw-thread {
  display: grid; grid-template-columns: 32px 1fr; column-gap: 16px;
  padding-top: 20px; border-top: 1px solid var(--sw-ink);
}
.sw-thread-key { font-family: var(--sw-mono); font-size: 13px; font-weight: 600; color: var(--sw-red); padding-top: 4px; }
.sw-thread-title { margin-bottom: 6px; font-weight: 700; }
.sw-thread-body { color: var(--sw-body); }
.sw-bio-note { margin-top: 8px; font-size: 15px; color: var(--sw-mute); }
@media (min-width: 900px) {
  .sw-about-photo { grid-column: 3 / span 3; }
  .sw-portrait { max-width: none; }
  .sw-bio { grid-column: 7 / span 6; }
}

/* News */
.sw-news li {
  display: grid; grid-template-columns: 96px 1fr; column-gap: 20px;
  padding: 14px 0; border-top: 1px solid var(--sw-ink);
  font-size: 17px; line-height: 1.45;
}
.sw-news li:last-child { border-bottom: 1px solid var(--sw-ink); }
.sw-news-date { font-family: var(--sw-mono); font-size: 13px; font-weight: 600; padding-top: 2px; font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .sw-news li { grid-template-columns: 160px 1fr; column-gap: 24px; } }

/* Service */
.sw-service-body { margin-top: 8px; font-size: 17px; line-height: 1.45; }
@media (min-width: 900px) {
  .sw-service-a { grid-column: 3 / span 5; }
  .sw-service-b { grid-column: 8 / span 5; }
}

/* Contact */
.sw-contact-list {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 24px; font-size: 15px; font-weight: 500;
}
@media (min-width: 900px) { .sw-contact-list { grid-column: 3 / span 6; } }

/* Footer with barcode */
.sw-foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px;
  padding: 24px 0 40px;
  font-family: var(--sw-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sw-mute);
}
.sw-barcode {
  width: 150px; height: 22px;
  background: repeating-linear-gradient(90deg, var(--sw-ink) 0 2px, transparent 2px 5px, var(--sw-ink) 5px 6px, transparent 6px 10px, var(--sw-ink) 10px 13px, transparent 13px 15px);
}

/* --- Inner-page title block --- */
.sw-pagehead { padding: 40px 0; border-bottom: 1px solid var(--sw-ink); align-items: end; }
.sw-pagehead h1 {
  font-size: clamp(44px, 5.6vw, 72px); font-weight: 800;
  line-height: 0.95; letter-spacing: -0.035em; text-transform: uppercase;
}
.sw-pagehead > p:last-child { font-size: 15px; line-height: 1.5; color: var(--sw-body); }
@media (min-width: 900px) {
  .sw-pagehead { padding: 48px 0 40px; }
  .sw-pagehead-label { grid-column: 1 / span 2; }
  .sw-pagehead h1 { grid-column: 3 / span 6; }
  .sw-pagehead > p:last-child { grid-column: 9 / span 4; }
}

/* Rotated status stamp */
.sw-stamp {
  align-self: flex-start;
  padding: 5px 10px; border: 2px solid var(--sw-red); color: var(--sw-red);
  font-family: var(--sw-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  transform: rotate(-3deg);
}

/* --- Publications --- */
.sw-year { padding: 32px 0 8px; border-bottom: 1px solid var(--sw-ink); }
.sw-year--end { border-bottom-width: 4px; padding-bottom: 24px; }
.sw-year-num { font-size: clamp(64px, 8vw, 96px); font-weight: 800; line-height: 0.85; letter-spacing: -0.05em; }
.sw-pubs li {
  display: grid; grid-template-columns: 32px 1fr; column-gap: 16px; row-gap: 6px;
  padding: 20px 0 28px; border-top: 1px solid var(--sw-hair);
  font-size: 17px; line-height: 1.4;
}
.sw-pubs li:first-child { padding-top: 0; border-top: 0; }
.sw-pub-no { font-family: var(--sw-mono); font-size: 13px; font-weight: 600; padding-top: 2px; color: var(--sw-mute); font-variant-numeric: tabular-nums; }
.sw-pub-title { font-weight: 600; }
.sw-pub-venue {
  grid-column: 2; font-family: var(--sw-mono); font-size: 11px; line-height: 1.5; padding-top: 2px;
  color: var(--sw-mute); text-transform: uppercase; letter-spacing: 0.08em;
}
.sw-pubs--compact li { grid-template-columns: 48px 1fr; font-size: 15px; padding: 14px 0 16px; }
.sw-pubs--compact .sw-pub-title { font-weight: 500; }
@media (min-width: 900px) {
  .sw-year { padding: 40px 0 8px; }
  .sw-year--end { padding-bottom: 32px; }
  .sw-year-num, .sw-year-label { grid-column: 1 / span 3; }
  .sw-pubs { grid-column: 4 / span 9; }
  .sw-pubs li { grid-template-columns: 40px 1fr 220px; column-gap: 24px; }
  .sw-pub-venue { grid-column: 3; }
  .sw-pubs--compact li { grid-template-columns: 56px 1fr 220px; }
}

/* --- Projects / Apps --- */
.sw-colheads {
  display: none;
  padding: 14px 0; border-bottom: 1px solid var(--sw-ink);
  font-family: var(--sw-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--sw-mute);
}
.sw-proj { padding: 32px 0 40px; border-bottom: 1px solid var(--sw-ink); }
.sw-proj--end { border-bottom-width: 4px; }
.sw-proj-no { font-size: 40px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: var(--sw-red); }
.sw-proj-code { font-family: var(--sw-mono); font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--sw-red); }
.sw-proj-body { display: flex; flex-direction: column; gap: 14px; }
.sw-kicker { font-family: var(--sw-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--sw-mute); }
.sw-proj-body h2 { font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.sw-proj-desc { font-size: 16px; line-height: 1.5; color: var(--sw-body); }
.sw-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 12px; }
.sw .sw-btn {
  padding: 10px 14px; border: 1px solid var(--sw-ink);
  font-family: var(--sw-mono); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
}
.sw .sw-btn:hover { background: var(--sw-ink); color: var(--sw-paper); }
.sw .sw-btn--solid { padding: 14px 20px; background: var(--sw-ink); color: var(--sw-paper); letter-spacing: 0.12em; }
.sw .sw-btn--solid:hover { background: var(--sw-red); border-color: var(--sw-red); color: #ffffff; }

/* Figure frame: white, dotted grid, crop marks */
.sw-fig { display: flex; flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 10px; width: 100%; }
.sw-frame {
  position: relative; padding: 20px;
  background-color: #ffffff;
  background-image: radial-gradient(var(--sw-ink) 0.6px, transparent 0.7px);
  background-size: 16px 16px;
  border: 1px solid var(--sw-ink);
}
.sw-frame img { position: relative; width: 100%; border: 1px solid var(--sw-ink); }
.sw-plate { height: 240px; display: flex; align-items: center; justify-content: center; }
.sw-plate img { width: auto; max-width: 100%; max-height: 100%; object-fit: contain; }
.sw-crop { position: absolute; width: 12px; height: 12px; border: 0 solid var(--sw-ink); }
.sw-crop--tl { left: 6px;  top: 6px;    border-left-width: 1px;  border-top-width: 1px; }
.sw-crop--tr { right: 6px; top: 6px;    border-right-width: 1px; border-top-width: 1px; }
.sw-crop--bl { left: 6px;  bottom: 6px; border-left-width: 1px;  border-bottom-width: 1px; }
.sw-crop--br { right: 6px; bottom: 6px; border-right-width: 1px; border-bottom-width: 1px; }
.sw-fig figcaption {
  display: flex; justify-content: space-between; gap: 16px;
  font-family: var(--sw-mono); font-size: 11px; line-height: 1.4;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--sw-mute);
}
@media (min-width: 900px) {
  .sw-colheads { display: grid; }
  .sw-colheads > :nth-child(1) { grid-column: 1 / span 1; }
  .sw-colheads > :nth-child(2) { grid-column: 2 / span 5; }
  .sw-colheads > :nth-child(3) { grid-column: 7 / span 6; }
  .sw-proj-no   { grid-column: 1 / span 1; }
  .sw-proj-body { grid-column: 2 / span 5; min-height: 340px; }
  .sw-fig       { grid-column: 7 / span 6; }
  .sw-plate     { height: 340px; }
}

/* Apps */
.sw .sw-app { padding: 40px 0 48px; row-gap: 32px; }
.sw-app h2 { font-size: clamp(44px, 5vw, 56px); font-weight: 900; line-height: 0.95; letter-spacing: -0.035em; text-transform: uppercase; }
.sw-app-tag { font-size: 18px; font-weight: 700; line-height: 1.3; }
.sw-app .sw-proj-body { gap: 18px; }
.sw-app .sw-btn--solid { align-self: flex-start; margin-top: 6px; }
.sw-specs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px;
  padding-top: 20px; border-top: 1px solid var(--sw-ink);
}
.sw-specs dt { margin-bottom: 8px; font-family: var(--sw-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--sw-mute); }
.sw-specs dd { font-size: 16px; }
@media (min-width: 900px) {
  .sw .sw-app { padding: 44px 0 56px; row-gap: 36px; }
  .sw-app .sw-proj-body { grid-column: 2 / span 5; min-height: 0; }
  .sw-app .sw-fig { grid-column: 8 / span 5; }
  .sw-specs { grid-column: 2 / span 11; grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* Figures: grayscale until the whole block is hovered (pointer devices only) */
@media (hover: hover) {
  .sw-proj img { filter: grayscale(1); transition: filter 0.35s ease; }
  .sw-proj:hover img, .sw-proj:focus-within img { filter: none; }
}
</style>

<!-- end custom head snippets -->
